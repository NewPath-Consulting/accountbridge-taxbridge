name: Deploy to EC2

on:
  push:
    branches:
      - dev

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  BACKEND_ECR_REPO: accountbridge-goml-api
  FRONTEND_ECR_REPO: accountbridge-goml-frontend
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ubuntu
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC token
      contents: read    # required for checkout

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: newpath-accountbridge-deploy
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Backend ──────────────────────────────────────────────────────────────
      - name: Build & push backend image
        run: |
          docker build \
            -f Dockerfile \
            -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/accountbridge-goml-api:${{ github.sha }} \
            -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/accountbridge-goml-api:latest \
            .
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/accountbridge-goml-api:${{ github.sha }}
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/accountbridge-goml-api:latest

      # ── Frontend ─────────────────────────────────────────────────────────────
      - name: Build & push frontend image
        run: |
          docker build \
            -f ui/Dockerfile \
            -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/accountbridge-goml-frontend:${{ github.sha }} \
            -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/accountbridge-goml-frontend:latest \
            .
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/accountbridge-goml-frontend:${{ github.sha }}
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/accountbridge-goml-frontend:latest

  deploy:
    name: Deploy on EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Write backend .env to EC2
        run: |
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "mkdir -p /home/ubuntu/accountbridge"
          echo "${{ secrets.BACKEND_ENV }}" | ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "cat > /home/ubuntu/accountbridge/.env"

      - name: Write frontend .env to EC2
        run: |
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "mkdir -p /home/ubuntu/accountbridge/ui"
          echo "${{ secrets.UI_ENV }}" | ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "cat > /home/ubuntu/accountbridge/ui/.env"

      - name: Copy docker-compose.yml to EC2
        run: |
          scp -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            docker-compose.yml \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/accountbridge/docker-compose.yml

      - name: Deploy on EC2
        run: |
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            # Ensure data directory exists
            mkdir -p /home/ubuntu/accountbridge/data

            cd /home/ubuntu/accountbridge

            # Login to ECR using instance role
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin \
              893616968164.dkr.ecr.us-east-1.amazonaws.com

            # Export vars for docker-compose
            export IMAGE_TAG=latest
            export AWS_ACCOUNT_ID=893616968164

            # Pull latest images
            docker compose pull

            # Start/restart containers
            docker compose up -d --remove-orphans

            # Remove unused images
            docker image prune -f

            echo "Deploy complete"
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/deploy_key

      - name: Health check backend
        run: |
          sleep 20
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "curl -sf http://localhost:8000/api/health && echo 'Backend healthy' || echo 'Backend health check failed'"
          rm -f /tmp/deploy_key
        continue-on-error: true
