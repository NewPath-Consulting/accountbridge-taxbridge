# DigitalOcean App Platform spec — TaxBridge proof of concept.
#
#   doctl apps create --spec .do/app.yaml
#   doctl apps update <app-id> --spec .do/app.yaml
#
# Two components from the two Dockerfiles already in the repo. The UI is
# standalone (streamlit and requests only, no imports from app/), so it builds
# from ui/ and talks to the API over the internal network.
#
# THINGS THAT WILL TRIP YOU UP HERE
#
# App Platform terminates any HTTP request at 100 seconds. It is a Cloudflare
# limit and cannot be raised. A reports run measured at a median of 80s and a
# p90 of 99s after the pipeline was parallelised, so it fits, but not by much.
# If runs start failing with a 504 that never happens locally, that is this.
#
# The filesystem is ephemeral. QuickBooks rotates its refresh token on every
# use and the adapter writes the new one back to .env, which does not survive
# a restart here. This is accepted for a proof of concept: when the token is
# spent, paste a fresh one through the UI, which posts to
# /api/quickbooks/credentials. Making that durable needs somewhere to store
# it, and that is out of scope for this spec.
#
# Every value below is either non-secret configuration or a placeholder.
# Secrets are typed SECRET and must be set in the DigitalOcean console or with
# `doctl apps update --spec`, never committed.

name: taxbridge
region: tor

services:
  # ---------------------------------------------------------------- API ----
  - name: api
    dockerfile_path: Dockerfile
    github:
      repo: yohannesf/taxbridge
      branch: main
      deploy_on_push: true

    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb

    health_check:
      http_path: /api/health/
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 5
      failure_threshold: 3

    routes:
      - path: /api

    envs:
      # --- secrets: set these in the console, they are not in the repo ---
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: QUICKBOOKS_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: QUICKBOOKS_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: QUICKBOOKS_REFRESH_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: WILDAPRICOT_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: TAX990_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: TAX990_CLIENT_SECRET_ID
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: TAX990_USER_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: BEARER_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME

      # --- identifiers: public, but organization-specific ---
      - key: QUICKBOOKS_REALM_ID
        scope: RUN_TIME
        value: REPLACE_ME
      - key: WILDAPRICOT_ACCOUNT_ID
        scope: RUN_TIME
        value: REPLACE_ME

      # --- configuration ---
      - key: ENV
        scope: RUN_TIME
        value: production
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: INFO
      - key: LLM_PROVIDER
        scope: RUN_TIME
        value: openai
      - key: LLM_MODEL
        scope: RUN_TIME
        value: gpt-4o-mini
      - key: REPORTS_MAX_TOKENS
        scope: RUN_TIME
        value: "16384"
      - key: AUTH_METHOD
        scope: RUN_TIME
        value: bearer

      # NOT goml_custom_extractor. That names a module which has never been in
      # this repository, and selecting it makes every extraction path raise on
      # import. The benchmark reads IRS e-file XML and needs no extractor at
      # all; AWS_textract is only reached by PDF upload, which additionally
      # needs AWS credentials to work.
      - key: EXTRACTOR_TYPE
        scope: RUN_TIME
        value: AWS_textract

      # The benchmark's reference documents ride in the image at /app/docs.
      - key: BENCHMARK_DOCS_SOURCE
        scope: RUN_TIME
        value: local
      - key: BENCHMARK_DOCS_LOCAL_PATH
        scope: RUN_TIME
        value: docs

      # The QuickBooks client writes each report it fetches to disk. Nothing
      # reads those files at runtime and the filesystem is ephemeral, so send
      # them somewhere writable and forgettable rather than into the image.
      - key: QUICKBOOKS_OUTPUT_DIR
        scope: RUN_TIME
        value: /tmp/quickbooks

  # ----------------------------------------------------------------- UI ----
  - name: ui
    dockerfile_path: ui/Dockerfile
    source_dir: ui
    github:
      repo: yohannesf/taxbridge
      branch: main
      deploy_on_push: true

    http_port: 8501
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb

    health_check:
      http_path: /_stcore/health
      initial_delay_seconds: 20
      period_seconds: 30

    routes:
      - path: /

    envs:
      # Resolved by App Platform to the API's internal address. The UI
      # otherwise defaults to localhost:8000, which is nothing here.
      - key: API_BASE_URL
        scope: RUN_TIME
        value: ${api.PRIVATE_URL}
      - key: BEARER_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: QUICKBOOKS_REALM_ID
        scope: RUN_TIME
        value: REPLACE_ME
      - key: WILDAPRICOT_ACCOUNT_ID
        scope: RUN_TIME
        value: REPLACE_ME
