version: "3.9"

services:
  backend:
    image: 893616968164.dkr.ecr.us-east-1.amazonaws.com/accountbridge-goml-api:${IMAGE_TAG:-latest}
    container_name: accountbridge-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    image: 893616968164.dkr.ecr.us-east-1.amazonaws.com/accountbridge-goml-frontend:${IMAGE_TAG:-latest}
    container_name: accountbridge-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - ui/.env
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  default:
    name: accountbridge-net
